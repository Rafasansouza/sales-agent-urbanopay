# =============================================================================
# UrbanoPay Mobilidade — execução local completa
# =============================================================================
# Fonte: ADR-016 (empacotamento e execução local), ADR-004 (PostgreSQL), ADR-012
# (Alembic é autoridade do schema), ADR-014, ADR-015.
#
# Alvo desta configuração:
#
#     git clone → cp .env.example .env → docker compose up --build
#
# Nada mais é exigido da máquina destino: nem Python, nem uv, nem Alembic, nem
# PostgreSQL, nem biblioteca alguma.
#
# Nenhum secret está embutido aqui. Todos os valores vêm do `.env`, que é
# ignorado pelo Git. `.env.example` sobe o sistema inteiro com providers fake,
# sem credencial externa.
#
# Serviços deliberadamente ausentes (ADR-016): Redis, porque não existe
# consumidor no código; OTel Collector, porque a telemetria está desligada por
# padrão; e container web separado, porque a página de demonstração é servida
# pela própria API e assim jamais recebe a credencial do provider.
# =============================================================================

name: urbanopay

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — source of truth transacional (ADR-004)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanopay}
      POSTGRES_USER: ${POSTGRES_USER:-urbanopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: `docker compose down` sem `-v` preserva os dados.
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanopay} -d ${POSTGRES_DB:-urbanopay}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [urbanopay]

  # ---------------------------------------------------------------------------
  # Migrations — job dedicado, e portão de startup (ADR-016)
  # ---------------------------------------------------------------------------
  # Roda até o fim e sai. Se falhar, `service_completed_successfully` não é
  # satisfeito e a **API não sobe**: schema errado nunca serve tráfego.
  #
  # Por ser um job único, réplicas da API não disputam migration. E Alembic
  # continua sendo a autoridade do schema: nenhum `create_all()`, nenhum
  # `setup()` de framework (ADR-012, ADR-014).
  migrate:
    # Sem `build:` próprio, de propósito: o job usa **a mesma imagem** da API,
    # construída uma única vez pelo serviço `api`. Dois serviços exportando a
    # mesma tag ao mesmo tempo colidem no builder, e construir duas imagens
    # idênticas seria desperdício — o que migra precisa ser exatamente o que
    # roda.
    image: urbanopay-api:local
    pull_policy: never
    restart: "no"
    env_file:
      # `required: false`: valida e sobe sem o arquivo, deixando o ambiente do
      # shell responder. Quem esquecer o `cp .env.example .env` recebe a
      # mensagem explícita da interpolação de POSTGRES_PASSWORD, e não um erro
      # obscuro de arquivo ausente.
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [urbanopay]

  # ---------------------------------------------------------------------------
  # API — FastAPI + Sales Agent (ADR-006, SPEC-004)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: urbanopay-api:local
    restart: unless-stopped
    # `env_file` é o único caminho pelo qual a credencial entra: em runtime,
    # nunca em build, nunca em layer (ADR-015).
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    networks: [urbanopay]

volumes:
  # Sem `name:` explícito, de propósito: o Compose prefixa com o nome do
  # projeto. É isso que permite validar em ambiente limpo
  # (`-p urbanopay_clean down -v`) sem destruir o volume de desenvolvimento.
  postgres_data:

networks:
  urbanopay:
    driver: bridge
