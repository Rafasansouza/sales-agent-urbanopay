# =============================================================================
# Raiz do workspace uv — UrbanoPay Mobilidade
# =============================================================================
# Decisão registrada em ADR-013 (Aceito).
#
# Esta raiz não é um pacote instalável: ela existe para (a) declarar o
# workspace, (b) centralizar a configuração de qualidade que cobre backend,
# testes e hooks do harness, e (c) manter um único `uv.lock` determinístico.
#
# O pacote real do backend é `apps/api/pyproject.toml`.
# =============================================================================

[project]
name = "urbanopay-monorepo"
version = "0.1.0"
description = "Raiz do monorepo da UrbanoPay Mobilidade"
requires-python = ">=3.13,<3.14"
dependencies = ["urbanopay"]

[tool.uv]
# A raiz nunca é construída nem publicada.
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
urbanopay = { workspace = true }

[dependency-groups]
dev = [
    # Cliente HTTP exigido por `starlette.testclient.TestClient`. O Starlette
    # importa `httpx2` e só recorre a `httpx` emitindo depreciação, por isso a
    # dependência é `httpx2` e não `httpx`.
    "httpx2>=2.12.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]


# -----------------------------------------------------------------------------
# Ruff — formatador e linter (ADR-013)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/api/src", "tests"]
extend-exclude = [".venv", "infra"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "ANN",  # flake8-annotations
    "RUF",  # regras próprias do Ruff
]
ignore = [
    # O projeto documenta em português; acentos e travessões são intencionais.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Os hooks do harness precisam invocar git e ferramentas locais por subprocess.
# Os comandos são literais fixos no código, nunca construídos a partir de
# entrada externa.
".claude/hooks/*.py" = ["S603", "S607"]
# `assert` é a forma idiomática de asserção em pytest.
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true


# -----------------------------------------------------------------------------
# mypy — verificação de tipos (ADR-013)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["apps/api/src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# Modo estrito nos módulos de domínio, conforme ADR-013.
[[tool.mypy.overrides]]
module = "urbanopay.*"
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true


# -----------------------------------------------------------------------------
# pytest — camadas de teste (CLAUDE.md, AGENT-HARNESS §5)
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# pytest-asyncio em modo strict: teste async exige @pytest.mark.asyncio,
# coerente com a regra de que todo teste declara seus marcadores.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: regra de dominio pura, sem I/O externo",
    "integration: fronteira de banco ou de provider, exige infraestrutura local",
    "e2e: jornada completa de compra ponta a ponta",
    "eval: comportamento probabilistico do agente conversacional",
]
