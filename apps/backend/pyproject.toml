# =============================================================================
# apps/backend — aplicação FastAPI e composition root (ADR-006, ADR-017)
# =============================================================================
# O que não é do agente: app FastAPI, composition root, sondas de saúde, webhook
# de pagamento, superfície de demonstração, coordenador pós-pagamento e provider
# de pagamento.
#
# É o **topo** da direção `database ← domains ← agent ← backend`: só ele conhece
# todos, e por isso só ele monta.
# =============================================================================
# Membro do workspace uv declarado na raiz. A configuração de Ruff, mypy e
# pytest é compartilhada e vive no `pyproject.toml` da raiz (ADR-013).
#
# Regra para novas dependências: dependência estrutural exige ADR antes da
# instalação (CLAUDE.md). Adicione com `uv add` e commite o `uv.lock` na mesma
# mudança.
# =============================================================================

[project]
name = "urbanopay"
version = "0.1.0"
description = "API do assistente inteligente de vendas da UrbanoPay Mobilidade"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Os três pacotes internos, na direção única do ADR-017.
    "urbanopay-database",
    "urbanopay-domains",
    "urbanopay-agent",
    # Camada HTTP (ADR-006).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Contratos tipados e configuração por ambiente (ADR-006).
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Alembic: o `migrate` do Compose roda a partir desta imagem.
    "alembic>=1.14",
]

# Dependências deliberadamente ausentes:
#
#   - langgraph-checkpoint-postgres: ADR-014 rejeita checkpointer durável
#     nativo. O estado conversacional pertence à aplicação e é versionado por
#     Alembic. Um teste de arquitetura reprova a presença deste pacote;
#   - SDK do Mercado Pago: exige credencial de teste que não existe.
#     FakePaymentProvider é o sandbox do MVP (ADR-007);
#   - OpenTelemetry e Langfuse: a instrumentação acompanha ADR-008, e o modo
#     de implantação do Langfuse segue aberto (H-04).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanopay"]
