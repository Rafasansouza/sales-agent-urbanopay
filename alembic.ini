# =============================================================================
# Alembic — UrbanoPay Mobilidade
# =============================================================================
# Fonte: ADR-012.
#
# A URL do banco NÃO fica aqui: o env.py a deriva das variáveis POSTGRES_* via
# Settings da aplicação (mesma fonte canônica do runtime). Nenhuma credencial
# neste arquivo.
#
# Regra permanente (ADR-012):
#   autogenerate -> migration candidata -> revisão humana obrigatória
# =============================================================================

[alembic]
script_location = apps/api/src/urbanopay/db/migrations

# Template do nome de arquivo: prefixo cronológico legível + slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Caminho adicionado ao sys.path para que `urbanopay` seja importável quando o
# alembic for invocado da raiz do repositório.
prepend_sys_path = apps/api/src

# Separador de caminhos das opções acima (os.pathsep). Sem isto o Alembic usa
# um fallback legado e emite DeprecationWarning.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
